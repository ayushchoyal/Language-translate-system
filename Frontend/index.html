<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Translate System</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <h1>Language Translate System</h1>


        <div class="row">
            <label>Source Language</label>
            <select id="sourceLang">
                <option value="en">English (en)</option>
                <option value="hi">Hindi (hi)</option>
                <option value="fr">French (fr)</option>
                <option value="de">German (de)</option>
                <option value="es">Spanish (es)</option>
                <option value="mr">Marathi (mr)</option>
                <option value="gu">Gujarati (gu)</option>
                <option value="ta">Tamil (ta)</option>
                <option value="te">Telugu (te)</option>
            </select>
        </div>


        <div class="row">
            <label>Target Language</label>
            <select id="targetLang">
                <option value="hi">Hindi (hi)</option>
                <option value="en">English (en)</option>
                <option value="fr">French (fr)</option>
                <option value="de">German (de)</option>
                <option value="es">Spanish (es)</option>
                <option value="mr">Marathi (mr)</option>
                <option value="gu">Gujarati (gu)</option>
                <option value="ta">Tamil (ta)</option>
                <option value="te">Telugu (te)</option>
            </select>
        </div>


        <div class="row">
            <label for="inputText">Text to Translate</label>
            <textarea id="inputText" rows="6" placeholder="Type or paste text here..."></textarea>
        </div>


        <div class="row actions">
            <button id="translateBtn">Translate</button>
            <button id="swapBtn" title="Swap languages">Swap</button>
            <span id="status"></span>
        </div>


        <div class="row">
            <label for="outputText">Translation</label>
            <textarea id="outputText" rows="6" readonly></textarea>
        </div>
    </div>


    <script src="app.js"></script>
</body>

</html>
